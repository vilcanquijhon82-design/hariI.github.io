*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif}
button{font:inherit;cursor:pointer}

.big{width:min(340px,90vw);padding:18px;font-size:1.2rem;font-weight:700;border:0;border-radius:12px;background:#fff;color:#0b4a6f}

#inicio small{opacity:.75;margin-top:14px}
#app{display:none;height:100%;flex-direction:column;position:relative}

#q{flex:1;min-width:160px}
.b{padding:9px 12px;border:0;border-radius:8px;background:#fff;color:#0b4a6f;font-weight:600}
.adm{display:none}#app.admin .adm{display:inline-block}#app.admin .row.adm{display:flex}

#mapa{flex:1;min-height:200px}

#app.admin #ficha{display:none!important}

<div id="app">
  <div id="bar"><div class="row">

function utm2ll(E,N){ // UTM zona 19 Sur -> [lat,lng]
 const a=6378137,e2=.00669437999014,ep=e2/(1-e2),k=.9996,x=E-5e5,M=(N-1e7)/k;

 return [lat*180/Math.PI,lon*180/Math.PI];
}

function entrar(m){

// ===== Mapa =====
function iniciarMapa(){
 mapa=L.map('mapa',{zoomControl:true,preferCanvas:true,maxZoom:21}).setView([-16.5718,-69.0449],17);
 sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:NATIVO,maxZoom:21,attribution:'Esri'}).addTo(mapa);
 calles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Esri'}); // calles (OpenStreetMap bloquea apps abiertas desde archivo)
 manz=L.featureGroup(MANZ.map(g=>L.polygon(pts(g),{color:'#fff',weight:3,fill:false,interactive:false}))).addTo(mapa);
 etiq=L.layerGroup(MANZ.map((g,i)=>{const p=pts(g),c=[p.reduce((a,x)=>a+x[0],0)/p.length,p.reduce((a,x)=>a+x[1],0)/p.length];return L.marker(c,{icon:L.divIcon({className:'mzl',html:'M'+(i+1),iconSize:[40,16]}),interactive:false,keyboard:false})})).addTo(mapa);
 mapa.on('zoomend',()=>mapa.getContainer().classList.toggle('lejos',mapa.getZoom()<17));
 grupo=L.layerGroup().addTo(mapa);
}
function capa(){enSat=!enSat;if(enSat){mapa.removeLayer(calles);sat.addTo(mapa)}else{mapa.removeLayer(sat);calles.addTo(mapa)}}
function pts(g){const r=[];for(let i=0;i<g.length;i+=2)r.push(utm2ll(ORG[0]+g[i]/10,ORG[1]+g[i+1]/10));return r}
function ll(l){return l.p||(l.p=pts(l.g))}
function ajustar(){mapa.fitBounds(manz.getBounds(),{padding:[20,20]})}

function dibujar(){
 grupo.clearLayers();capas={};
 const f=modo==='admin'?document.getElementById('filtro').value:"";
 lotes.forEach(l=>{
  if(f&&l.estado!==f)return;
  const poly=L.polygon(ll(l),{color:"#fde047",weight:BORDE,fillColor:COL[l.estado]||"#f59e0b",fillOpacity:RELLENO}).addTo(grupo);
  if(modo==='admin')poly.bindPopup(()=>popupAdmin(l),{minWidth:200});
  poly.on('click',e=>{sel=l.codigo;if(modo==='consulta')fichaConsulta(l);else{abrirEditor(l);poly.openPopup(e.latlng)}});
  capas[l.codigo]=poly;
 });
 manz.eachLayer(p=>p.bringToFront()); // manzanas siempre encima de los lotes
 progreso();
}
function progreso(){
 const t=lotes.length,ok=lotes.filter(l=>l.estado!=="SIN REGISTRAR").length,p=t?Math.round(ok*100/t):0;
 document.getElementById('pt').textContent=p+"% — "+ok+" de "+t+" lotes";
 document.getElementById('pb').style.width=p+"%";
}

 editando=l.codigo;const g=id=>document.getElementById(id),ed=g('editor'),was=ed.style.display==='block';

 l.mod=true;Object.assign(l,{codigo:nuevo,lote:v('e_lot'),manzana:v('e_man'),dueno:v('e_due').toUpperCase(),dni:v('e_dni'),estado:v('e_est'),obs:v('e_obs')});

}

 if(!q){r.style.display='none';return}

 r.innerHTML=h.length?h.map(l=>`<div onclick="ir('${esc(l.codigo)}')"><b>${esc(l.codigo)}</b> — ${esc(l.dueno)||"Sin registrar"} <small>${esc(l.estado)}</small></div>`).join(""):"<div>Sin resultados</div>";
 r.style.display='block';r.style.top=document.getElementById('bar').offsetHeight+'px';
}
function ir(c){
 document.getElementById('res').style.display='none';
 const l=L1(c);if(!l)return;
 if(!capas[c]){document.getElementById('filtro').value="";dibujar()}
 mapa.fitBounds(capas[c].getBounds(),{maxZoom:19});sel=c;
 if(modo==='admin'){abrirEditor(l);capas[c].openPopup()}else fichaConsulta(l);
}

function fichaConsulta(l){
 const f=document.getElementById('ficha');
 f.innerHTML=`<b>📍 Lote: ${esc(l.codigo)}</b><br>Manzana: ${esc(l.manzana)}<br>Dueño / Poseedor: ${esc(l.dueno)||"—"}<br>DNI: ${esc(l.dni)||"—"}<br>Estado: <b>${esc(l.estado)}</b><br>Observación: ${esc(l.obs)||"—"}`+
 (l.estado==="SIN REGISTRAR"?`<div class="rojo">Este lote aún no está catastrado. Acérquese a la Municipalidad Distrital de Desaguadero - Oficina de Catastro.</div>`:"")+
 `<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="b" style="background:#0b4a6f;color:#fff" onclick="imprimir('${esc(l.codigo)}','Constancia de Consulta Catastral')">🖨️ Imprimir Constancia</button><button class="b" style="background:#16a34a;color:#fff" onclick="gmaps('${esc(l.codigo)}')">📍 Ver mi lote en Google Maps</button></div>`;
 f.style.display='block';mapa.invalidateSize();
}
function gmaps(c){const p=ll(L1(c))[0];window.open(`https://www.google.com/maps?q=${p[0]},${p[1]}`,'_blank')}
function imprimir(c,t){
 const l=L1(c),w=window.open('','_blank');
 w.document.write(`<title>${t}</title><body style="font-family:Arial;padding:30px"><h2>MUNICIPALIDAD DISTRITAL DE DESAGUADERO</h2><h3>${t}</h3><hr><p><b>Lote:</b> ${esc(l.codigo)}</p><p><b>Manzana:</b> ${esc(l.manzana)}</p><p><b>Dueño / Poseedor:</b> ${esc(l.dueno)}</p><p><b>DNI:</b> ${esc(l.dni)}</p><p><b>Estado:</b> ${esc(l.estado)}</p><p><b>Observación:</b> ${esc(l.obs)}</p><hr><small>Emitido el ${new Date().toLocaleDateString('es-PE')} — Oficina de Catastro, Desaguadero - Puno</small></body>`);
 w.document.close();w.print();
}

// ===== CSV / GeoJSON =====
function exportar(){
 const H=["codigo","manzana","lote","dueno","dni","estado","obs"],q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
 const t=[H.join(",")].concat(lotes.map(l=>H.map(h=>q(l[h])).join(","))).join("\n");
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="catastro_desaguadero.csv";a.click();
}
function parseCSV(t){const r=[];let f="",row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f="";if(row.some(x=>x))r.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x))r.push(row);return r}
csvIn.onchange=async e=>{
 const r=parseCSV((await e.target.files[0].text()).replace(/^\ufeff/,"")),h=r.shift().map(x=>x.trim().toLowerCase());let n=0;
 r.forEach(f=>{const o={};h.forEach((k,i)=>o[k]=f[i]);const l=L1((o.codigo||"").toUpperCase());if(l){["manzana","lote","dueno","dni","obs"].forEach(k=>{if(o[k]!==undefined)l[k]=o[k]});if(ESTADOS.includes((o.estado||"").toUpperCase()))l.estado=o.estado.toUpperCase();l.mod=true;n++}});
 guardarLS();dibujar();alert(n+" lotes actualizados");e.target.value="";
};
